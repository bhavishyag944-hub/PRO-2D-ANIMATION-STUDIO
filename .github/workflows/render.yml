name: 2D Animation Cloud Renderer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      
      - name: Render Animation
        run: |
          echo "Checking project files"
          pwd
          ls -la
          ls -la src
          mkdir -p out
          npx remotion render ./src/index.jsx Main ./out/video.mp4

      - name: Upload Final MP4
        uses: actions/upload-artifact@v4
        with:
          name: animation-video
          path: out/video.mp4
          
